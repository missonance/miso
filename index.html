    <style>
    /* ── TAS panel overlay ───────────────────────────────────────── */
    #tas-panel {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;          /* shown by window.electron.openTasTool() */
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
    }
    #tas-panel.visible { display: flex; }

    /* Scoped TAS tool styles (originally tas-tool.css) */
#tas-panel{margin:0;font-family:sans-serif;background:#1e1e28;color:#eee;height:100vh;flex-direction:column}
#tas-panel header{padding:12px 16px;border-bottom:1px solid #2a2a3a}
#tas-panel main{padding:16px;display:grid;grid-template-columns:240px 1fr;grid-template-rows:140px 1fr auto auto;gap:12px;flex:1 1 auto;min-height:0}
#tas-panel label{font-size:12px;color:#bbb}
#tas-panel textarea{width:100%;height:180px;background:#0f0f17;color:#eee;border:1px solid #2a2a3a;border-radius:6px;padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:12px;resize:vertical}
#tas-panel .decoded-editor{width:100%;height:180px;background:#0f0f17;color:#eee;border:1px solid #2a2a3a;border-radius:6px;padding:10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;font-size:12px;resize:vertical;overflow-y:auto;white-space:pre-wrap;}
#tas-panel .decoded-editor:focus{outline:none;border-color:#3842d0}
#tas-panel button{background:#3842d0;border:none;color:#fff;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer;align-self:flex-start}
#tas-panel button:disabled{opacity:.6;cursor:default}
#tas-panel .row{display:flex;gap:8px;align-items:center}
#tas-panel .ghosts{border:1px solid #2a2a3a;border-radius:6px;padding:8px}
#tas-panel .ghosts h2{margin:0 0 6px 0;font-size:13px;color:#bbb}
#tas-panel .ghosts-list{display:flex;flex-direction:column;gap:6px}
#tas-panel .ghost-item{display:flex;gap:8px;align-items:center}
#tas-panel .ghost-color{width:12px;height:12px;border-radius:50%;border:1px solid #444}
#tas-panel .ghost-name{flex:1}
#tas-panel .ghost-item input[type=checkbox]{width:14px;height:14px}
#tas-panel .ghosts{grid-column:1;grid-row:1/5;overflow:auto;min-height:0}
#tas-panel .section-encoded{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-height:0}
#tas-panel .section-decoded{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;min-height:0;position:relative}
#tas-panel .section-decoded .decoded-editor{height:100%;resize:none}
#tas-panel .section-controls{grid-column:2;grid-row:4;display:flex;flex-direction:column;gap:8px}
#tas-panel #command-row{grid-column:2;grid-row:3}
#tas-panel #command{flex:1 1 auto;min-width:0;width:auto}
#tas-panel .palette-overlay{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:9999}
#tas-panel .palette{width:640px;max-width:90vw;background:#0f0f17;border:1px solid #2a2a3a;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden}
#tas-panel .palette-input{width:100%;box-sizing:border-box;background:#0f0f17;color:#eee;border:none;border-bottom:1px solid #2a2a3a;padding:12px 14px;font-size:14px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;outline:none}
#tas-panel .palette-list{max-height:50vh;overflow:auto}
#tas-panel .palette-item{padding:10px 14px;border-bottom:1px solid #1a1a24;cursor:pointer;display:flex;flex-direction:column;gap:2px}
#tas-panel .palette-item:last-child{border-bottom:none}
#tas-panel .palette-item.active{background:#1a1a24}
#tas-panel .palette-title{font-size:13px;color:#fff}
#tas-panel .palette-sub{font-size:11px;color:#bbb}
#tas-panel .decoded-scroll{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#tas-panel .decoded-scroll button{width:28px;height:28px;padding:0;border-radius:6px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;background:#2f37b8}
#tas-panel .decoded-scroll button:disabled{opacity:.6}
#tas-panel .decoded-scroll button{pointer-events:auto}
#tas-panel .decoded-overlay{position:absolute;pointer-events:none;z-index:5}
#tas-panel .tas-cmd-arrow{position:absolute;width:16px;height:16px;line-height:16px;text-align:center;font-size:10px;border:none;border-radius:3px;background:#2f37b8;color:#fff;cursor:pointer;padding:0;pointer-events:auto}

    /* Fix: header needs flex row for close button */
    #tas-panel header { display: flex; align-items: center; }
    /* Palette overlays are position:fixed so they work at viewport level */
    #tas-panel .palette-overlay { z-index: 10001; }

        <button id="copy">Copy</button>
        <button id="clear">Clear</button>

      </div>
    </div>
  </main>

      </div>
      <div id="bookmarks-list" class="palette-list"></div>

    <script>
    // ── CORS proxy shim ──────────────────────────────────────────────────────
    // Rewrites XHR requests to vps.kodub.com through a Cloudflare Worker proxy.
    // Deploy cors-proxy-worker.js to Cloudflare Workers and update PROXY_BASE.
    (function () {
        var PROXY_BASE   = "https://soft-truth-6e93.missonance.workers.dev";
        var UPSTREAM_HOST = "vps.kodub.com";

        var NativeXHR = window.XMLHttpRequest;
        function PatchedXHR() { this._xhr = new NativeXHR(); }
        PatchedXHR.prototype = Object.create(NativeXHR.prototype);

        // Forward every standard event/property from the inner XHR to the outer
        ["onreadystatechange","onload","onerror","onprogress","ontimeout","onabort",
         "onloadstart","onloadend"].forEach(function(ev) {
            Object.defineProperty(PatchedXHR.prototype, ev, {
                get: function()  { return this._xhr[ev]; },
                set: function(v) { this._xhr[ev] = v; }
            });
        });
        ["readyState","status","statusText","responseText","response",
         "responseType","responseURL","responseXML","timeout","withCredentials",
         "upload","UNSENT","OPENED","HEADERS_RECEIVED","LOADING","DONE"].forEach(function(p) {
            Object.defineProperty(PatchedXHR.prototype, p, {
                get: function()  { return this._xhr[p]; },
                set: function(v) { this._xhr[p] = v; }
            });
        });

        PatchedXHR.prototype.open = function(method, url) {
            var rewritten = url;
            try {
                var parsed = new URL(url, location.href);
                if (parsed.hostname === UPSTREAM_HOST) {
                    rewritten = PROXY_BASE.replace(/\/$/, "") + parsed.pathname + parsed.search;
                }
            } catch(e) {}
            return this._xhr.open.call(this._xhr, method, rewritten,
                arguments[2] !== false,   // async (default true)
                arguments[3], arguments[4]);
        };
        PatchedXHR.prototype.send            = function(b) { return this._xhr.send(b); };
        PatchedXHR.prototype.setRequestHeader= function(h,v){ return this._xhr.setRequestHeader(h,v); };
        PatchedXHR.prototype.getResponseHeader     = function(h)  { return this._xhr.getResponseHeader(h); };
        PatchedXHR.prototype.getAllResponseHeaders  = function()   { return this._xhr.getAllResponseHeaders(); };
        PatchedXHR.prototype.abort                  = function()   { return this._xhr.abort(); };
        PatchedXHR.prototype.overrideMimeType        = function(m) { return this._xhr.overrideMimeType(m); };

        window.XMLHttpRequest = PatchedXHR;
    })();
    // ────────────────────────────────────────────────────────────────────────
    
    // Replaces Electron preload.js + main.js IPC.
    // Everything runs in the same page so calls are direct — no messaging needed.
    (function () {
        "use strict";

        var _ghostsUpdateListeners = [];
        var _applyListeners        = [];
        var _visListeners          = [];
        var _loadListeners         = [];
        var _encodedUpdateListeners = [];
        var _lastGhosts = null;

        // ── Codec (browser port of main.js Node/zlib logic) ──────────────────

        function base64urlToBytes(str) {
            var s = str.replace(/-/g,"+").replace(/_/g,"/");
            var pad = s.length % 4; if (pad) s += "=".repeat(4-pad);
            var bin = atob(s), out = new Uint8Array(bin.length);
            for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
            return out;
        }
        function bytesToBase64url(buf) {
            var bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
            var bin = "";
            for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
        }
        async function inflate(compressed) {
            var ds = new DecompressionStream("deflate");
            var w = ds.writable.getWriter(); w.write(compressed); w.close();
            var r = ds.readable.getReader(), chunks=[], total=0;
            while(true){ var x=await r.read(); if(x.done) break; chunks.push(x.value); total+=x.value.length; }
            var out=new Uint8Array(total), off=0;
            for(var c of chunks){ out.set(c,off); off+=c.length; } return out;
        }
        async function deflate(raw) {
            var cs = new CompressionStream("deflate");
            var w = cs.writable.getWriter();
            w.write(raw instanceof Uint8Array ? raw : new Uint8Array(raw)); w.close();
            var r = cs.readable.getReader(), chunks=[], total=0;
            while(true){ var x=await r.read(); if(x.done) break; chunks.push(x.value); total+=x.value.length; }
            var out=new Uint8Array(total), off=0;
            for(var c of chunks){ out.set(c,off); off+=c.length; } return out;
        }
        function readU24(a,p){ return a[p]|(a[p+1]<<8)|(a[p+2]<<16); }
        function writeU24(a,p,v){ a[p]=v&0xff; a[p+1]=(v>>8)&0xff; a[p+2]=(v>>16)&0xff; }

        async function decodeTasRecording(encoded) {
            try {
                if (typeof encoded !== "string" || !encoded) return null;
                var a = await inflate(base64urlToBytes(encoded));
                var s = 0;
                function readArr() {
                    if (s+3 > a.length) return null;
                    var len=readU24(a,s); s+=3; var arr=new Array(len), prev=0;
                    for(var i=0;i<len;i++){
                        if(s+3>a.length) return null;
                        var d=readU24(a,s); s+=3; prev=i===0?d:prev+d; arr[i]=prev;
                    }
                    return arr;
                }
                var up=readArr(),right=readArr(),down=readArr(),left=readArr(),reset=readArr();
                if([up,right,down,left,reset].some(function(x){return x==null;})) return null;
                return {up:up,right:right,down:down,left:left,reset:reset};
            } catch(e){ return null; }
        }
        async function encodeTasRecording(rec) {
            try {
                if (!rec) return null;
                var keys=["up","right","down","left","reset"], parts=[];
                for(var k of keys){
                    var arr=rec[k]||[], buf=new Uint8Array(3+3*arr.length);
                    writeU24(buf,0,arr.length);
                    var prev=0;
                    for(var i=0;i<arr.length;i++){ writeU24(buf,3+3*i,arr[i]-prev); prev=arr[i]; }
                    parts.push(buf);
                }
                var total=0; for(var p of parts) total+=p.length;
                var raw=new Uint8Array(total), off=0;
                for(var p of parts){ raw.set(p,off); off+=p.length; }
                return bytesToBase64url(await deflate(raw));
            } catch(e){ return null; }
        }
        function formatTasHuman(rec) {
            try {
                if (!rec) return "";
                var order=["up","left","down","right"],keyMap={up:"w",left:"a",down:"s",right:"d"};
                var sets={}, allFrames=new Set();
                for(var d of order){ sets[d]=new Set(rec[d]||[]); for(var f of rec[d]||[]) allFrames.add(f); }
                var frames=Array.from(allFrames).sort(function(a,b){return a-b;});
                var held={up:false,left:false,down:false,right:false}, lines=[];
                for(var frame of frames){
                    for(var dir of order){ if(sets[dir].has(frame)) held[dir]=!held[dir]; }
                    var keys=""; for(var dir of order){ if(held[dir]) keys+=keyMap[dir]; }
                    lines.push(frame+","+keys);
                }
                return lines.join("\n");
            } catch(e){ return ""; }
        }
        function parseTasHuman(text) {
            try {
                var rawLines=text.split("\n").map(function(l){ var h=l.indexOf("#"); return h>=0?l.slice(0,h):l; }).filter(function(l){ return l.trim()!==""; });
                var entries=[];
                for(var line of rawLines){
                    var parts=line.split(","); if(parts.length!==2) continue;
                    var frame=parseInt(parts[0],10), keys=parts[1].trim();
                    if(!isNaN(frame)) entries.push({frame:frame,keys:keys});
                }
                var keyMap={w:"up",a:"left",s:"down",d:"right"};
                var rec={up:[],right:[],down:[],left:[],reset:[]};
                var held={up:false,left:false,down:false,right:false};
                var last=-1;
                for(var entry of entries){
                    if(entry.frame<=last) continue;
                    var want={up:false,left:false,down:false,right:false};
                    for(var ch of entry.keys){ var dir=keyMap[ch]; if(dir) want[dir]=true; }
                    for(var dir in held){ if(held[dir]!==want[dir]) rec[dir].push(entry.frame); }
                    Object.assign(held,want); last=entry.frame;
                }
                return rec;
            } catch(e){ return null; }
        }

        // ── File I/O (replaces Electron dialog + fs) ─────────────────────────
        async function tasToolSaveToFile(text) {
            var content = typeof text === "string" ? text : "";
            if (window.showSaveFilePicker) {
                try {
                    var handle = await window.showSaveFilePicker({
                        suggestedName: "tas-script.tas",
                        types: [{ description: "TAS Scripts", accept: { "text/plain": [".tas",".txt"] } }]
                    });
                    var w = await handle.createWritable();
                    await w.write(content); await w.close();
                    return { canceled: false, filePath: handle.name };
                } catch(e) {
                    if (e && e.name === "AbortError") return { canceled: true };
                    return { canceled: true, error: String(e&&e.message||e) };
                }
            }
            // Fallback
            try {
                var blob = new Blob([content],{type:"text/plain"});
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a"); a.href=url; a.download="tas-script.tas";
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
                return { canceled: false };
            } catch(e){ return { canceled: true, error: String(e&&e.message||e) }; }
        }
        async function tasToolLoadFromFile() {
            if (window.showOpenFilePicker) {
                try {
                    var [handle] = await window.showOpenFilePicker({
                        types: [{ description: "TAS Scripts", accept: { "text/plain": [".tas",".txt"] } }],
                        multiple: false
                    });
                    var file = await handle.getFile();
                    return { canceled: false, filePath: file.name, content: await file.text() };
                } catch(e) {
                    if (e && e.name === "AbortError") return { canceled: true };
                    return { canceled: true, error: String(e&&e.message||e) };
                }
            }
            return new Promise(function(resolve) {
                var input = document.createElement("input");
                input.type = "file"; input.accept = ".tas,.txt,text/plain";
                input.style.display = "none";
                var resolved = false;
                input.onchange = function() {
                    var file = input.files && input.files[0];
                    if (!file) { if(!resolved){ resolved=true; resolve({canceled:true}); } return; }
                    var reader = new FileReader();
                    reader.onload = function(e){ if(!resolved){ resolved=true; resolve({canceled:false,filePath:file.name,content:e.target.result}); } };
                    reader.onerror = function(){ if(!resolved){ resolved=true; resolve({canceled:true,error:"Read error"}); } };
                    reader.readAsText(file);
                };
                document.body.appendChild(input); input.click();
                setTimeout(function(){ try{ document.body.removeChild(input); }catch(e){} }, 2000);
            });
        }

        // ── Ghost state cache ─────────────────────────────────────────────────
        function mergeGhosts(existing, incoming) {
            if (!incoming || !Array.isArray(incoming.names)) return existing;
            var payload = Object.assign({}, incoming);
            if (existing && Array.isArray(existing.names) && existing.names.length === incoming.names.length) {
                if (Array.isArray(existing.visibility)) {
                    payload.visibility = (Array.isArray(incoming.visibility) && incoming.visibility.length === existing.visibility.length)
                        ? incoming.visibility : existing.visibility;
                }
                if (Array.isArray(existing.colors) && (!Array.isArray(incoming.colors) || incoming.colors.length !== existing.colors.length))
                    payload.colors = existing.colors;
                if (Array.isArray(existing.secondaryColors) && (!Array.isArray(incoming.secondaryColors) || incoming.secondaryColors.length !== existing.secondaryColors.length))
                    payload.secondaryColors = existing.secondaryColors;
            }
            return payload;
        }

        // ── Panel open/close ──────────────────────────────────────────────────
        function openPanel() {
            var panel = document.getElementById("tas-panel");
            if (panel) panel.classList.add("visible");
        }
        function closePanel() {
            var panel = document.getElementById("tas-panel");
            if (panel) panel.classList.remove("visible");
        }

        // ── window.electron shim ──────────────────────────────────────────────
        window.electron = {
            quit: function() { /* no-op in browser */ },

            addFullscreenChangeListener: function(fn) {
                document.addEventListener("fullscreenchange", fn);
            },
            isFullscreen: function() { return !!document.fullscreenElement; },
            setFullscreen: function(val) {
                if (val && !document.fullscreenElement)
                    document.documentElement.requestFullscreen().catch(function(){});
                else if (!val && document.fullscreenElement)
                    document.exitFullscreen().catch(function(){});
            },

            openTasTool: function() { openPanel(); },

            setTasRecording: function(rec) {
                try {
                    var encoded = typeof rec === "string" ? rec
                        : (rec && rec.serialize ? rec.serialize() : "");
                    (async function() {
                        var decoded = await decodeTasRecording(encoded);
                        var human   = decoded ? formatTasHuman(decoded) : "";
                        window.__tasEncoded = encoded;
                        window.__tasDecoded = human;
                        var encEl = document.getElementById("encoded");
                        if (encEl) encEl.value = encoded || "";
                        // setHuman is defined in the TAS tool script scope below
                        if (typeof window.__tasPanelSetHuman === "function")
                            window.__tasPanelSetHuman(human);
                        _encodedUpdateListeners.forEach(function(fn){ try{fn(encoded);}catch(e){} });
                    })();
                } catch(e) {}

        f.addEventListener("input", function(){ refresh(); });
        f.addEventListener("keydown", function(e){
          if (e.key === "Enter"){ e.preventDefault(); e.shiftKey ? prev() : next(); }
        });

        window.addEventListener("keydown", function(e){
          if ((e.ctrlKey || e.metaKey) && (e.key === "f" || e.code === "KeyF")){
            e.preventDefault();
            fb.style.display = "flex";
            f.focus(); try { f.select(); } catch (e) {}
            refresh();
          } else if (e.key === "Escape" && fb.style.display !== "none"){
            e.preventDefault();
            fb.style.display = "none";
          } else if (e.key === "F3" && fb.style.display !== "none"){
            e.preventDefault();
            e.shiftKey ? prev() : next();
          }
        });

        var _setHuman = setHuman;
        setHuman = function(v){
          _setHuman(v);
          try { if (fb.style.display !== "none") refresh(); } catch (e) {}
        };
      }
    })();

    // ---- Command expand/collapse overlay for decoded textarea ----
    (function(){
      var ta = $("decoded");
      var ov = $("decoded-overlay");
      if (!ta || !ov) return;

      var scheduled = false;
      var measureCanvas = document.createElement('canvas');
      var measureCtx = measureCanvas.getContext('2d');

      function normalizeKeys(str){
        var order = ["w","a","s","d"]; var set = new Set();
        for (var k of String(str||"")) if (order.indexOf(k) >= 0) set.add(k);
        return order.filter(function(k){ return set.has(k); }).join("");
      }
      function parseLines(text){
        return (text||"").split("\n").map(function(line){ var idx=line.indexOf("#"); return idx>=0?line.slice(0,idx):line; })
          .filter(function(line){ return line.trim()!==""; })
          .map(function(line){ var parts=line.split(","); var frame=parseInt(parts[0],10); var keys=(parts.slice(1).join(",")||"").trim(); return { frame: frame, keys: normalizeKeys(keys) }; })
          .filter(function(e){ return !isNaN(e.frame); })
          .sort(function(a,b){ return a.frame - b.frame; });
      }
      function getStateAt(entries, frame){ var state=""; for (var i=0;i<entries.length;i++){ if (entries[i].frame <= frame) state = entries[i].keys; else break; } return state; }
      function toEntries(map){ return Array.from(map.entries()).map(function(e){ return { frame: e[0], keys: e[1] }; }).sort(function(a,b){ return a.frame - b.frame; }); }

      function getBaseAndCommands(){
        var text = ta.value || "";
        var lines = text.split("\n");
        var commands = [];
        var base = [];
        for (var i=0; i<lines.length; i++){
          var line = lines[i];
          var hashIdx = line.indexOf('#');
          var codePart = (hashIdx >= 0 ? line.slice(0, hashIdx) : line).trim();
          if (/^(tap|hold)\s+/i.test(codePart)){
            commands.push({ lineIndex: i, text: codePart, fullLine: line });
          } else if (codePart.length) {
            base.push(codePart);
          }
        }
        return { base: parseLines(base.join("\n")), commands: commands };
      }

      function findGeneratedRange(lines, idx, cmd){
        var begin = '# BEGIN generated: ' + cmd;
        var end = '# END generated: ' + cmd;
        if (lines[idx+1] && lines[idx+1].trim() === begin){
          for (var k = idx+2; k < lines.length; k++){
            if ((lines[k]||'').trim() === end){ return { from: idx+1, to: k }; }
          }
        }
        return null;
      }

      function applyHold(out, cmd){
        var m = cmd.match(/^hold\s+([wasd]+)\s+for\s+(\d+)\s+at\s+(\d+)$/i) || cmd.match(/^hold\s+([wasd]+)\s+(\d+)\s+(\d+)$/i);
        if (!m) return [];
        var held = normalizeKeys(m[1]); var dur = parseInt(m[2],10); var start = parseInt(m[3],10);
        if (!held || isNaN(dur) || isNaN(start) || dur <= 0) return [];
        var end = start + dur;
        var before = new Map(out);
        var snapshot = toEntries(out);
        var startBase = getStateAt(snapshot, start);
        var startSet = new Set((startBase||"").split("")); for (var ch of held) startSet.add(ch);
        out.set(start, normalizeKeys(Array.from(startSet).join("")));
        for (var i=0; i<snapshot.length; i++){
          var e = snapshot[i]; if (e.frame > start && e.frame < end){ var mid = new Set((e.keys||"").split("")); for (var ch2 of held) mid.add(ch2); out.set(e.frame, normalizeKeys(Array.from(mid).join(""))); }
        }
        var endBase = getStateAt(snapshot, end);
        out.set(end, normalizeKeys(endBase));
        // diff
        var diff = [];
        out.forEach(function(val, key){ var prev = before.get(key); if (prev !== val) diff.push([key, val]); });
        return diff.sort(function(a,b){ return a[0]-b[0]; });
      }
      function applyTap(out, cmd){
        var parts = cmd.split(/\s+/); if (parts.length !== 6) return [];
        var arr = parts.map(function(t,i){ return (i>0 && i!==3) ? parseInt(t,10) : t; });
        var r = arr[1], a2 = arr[2], o = arr[3], s = arr[4], i2 = arr[5];
        if ([r,a2,s,i2].some(isNaN) || r >= a2 || s <= 0 || i2 <= 0) return [];
        var before = new Map(out);
        var snapshot = toEntries(out);
        var lastKeys = ""; var lastFrame = -1;
        for (var u=0; u<snapshot.length; u++){ var e = snapshot[u]; if (e.frame < r && e.frame > lastFrame){ lastKeys = e.keys; lastFrame = e.frame; } }
        var p = r; while (p <= a2){ out.set(p, normalizeKeys(String(o))); p += s; if (p > a2) break; out.set(p, normalizeKeys(String(lastKeys))); p += i2; }
        var diff = [];
        out.forEach(function(val, key){ var prev = before.get(key); if (prev !== val) diff.push([key, val]); });
        return diff.sort(function(a,b){ return a[0]-b[0]; });
      }

      function computeDeltas(){
        var bc = getBaseAndCommands();
        var out = new Map(bc.base.map(function(e){ return [e.frame, e.keys]; }));
        var deltas = new Map(); // lineIndex -> [ [frame,keys], ... ]
        var ordered = bc.commands.slice().sort(function(a,b){ return a.lineIndex - b.lineIndex; });
        for (var k=0; k<ordered.length; k++){
          var c = ordered[k];
          var d;
          if (/^hold\s+/i.test(c.text)) d = applyHold(out, c.text); else if (/^tap\s+/i.test(c.text)) d = applyTap(out, c.text); else d = [];
          deltas.set(c.lineIndex, d);
        }
        return { deltas: deltas, commands: bc.commands };
      }

      function render(){
        try {
          // Size overlay to match textarea box
          var rect = ta.getBoundingClientRect();
          var parentRect = ov.parentElement.getBoundingClientRect();
          ov.style.left = (rect.left - parentRect.left) + 'px';
          ov.style.top = (rect.top - parentRect.top) + 'px';
          ov.style.width = rect.width + 'px';
          ov.style.height = rect.height + 'px';
        } catch(e) {}
        ov.textContent = '';

        var style = window.getComputedStyle(ta);
        var lineHeight = parseFloat(style.lineHeight) || (parseFloat(style.fontSize) * 1.2) || 15;
        var padTop = parseFloat(style.paddingTop) || 0;
        var padLeft = parseFloat(style.paddingLeft) || 0;
        var rightPad = parseFloat(style.paddingRight) || 0;
        var del = computeDeltas();
        var cmds = del.commands;
        var deltas = del.deltas;
        var clientH = ta.clientHeight;
        var text = ta.value || '';
        var lines = text.split('\n');
        // font for measuring
        var fontStr = style.font || (style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily);
        try { measureCtx.font = fontStr; } catch(e) {}

        for (var i=0; i<cmds.length; i++){
          var c = cmds[i];
          var topPx = padTop + c.lineIndex * lineHeight - ta.scrollTop;
          if (topPx < -lineHeight || topPx > clientH) continue;
          var rng = findGeneratedRange(lines, c.lineIndex, c.text);
          var isOpen = !!rng;
          // If the command text no longer matches strict pattern, don't show arrow
          if (!/^((tap\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+)|(hold\s+[wasd]+\s+(for\s+\d+\s+at\s+\d+|\d+\s+\d+)))$/i.test(c.text)){
            continue;
          }
          var btn = document.createElement('button');
          btn.className = 'tas-cmd-arrow';
          btn.textContent = isOpen ? '▾' : '▸';
          var lineText = lines[c.lineIndex] || '';
          var w = 0; try { w = measureCtx.measureText(lineText).width || 0; } catch(e) { w = (lineText.length * (parseFloat(style.fontSize)||12) * 0.6); }
          var maxLeft = ta.clientWidth - rightPad - 18;
          var leftPx = Math.min(padLeft + w + 6, maxLeft);
          btn.style.left = Math.round(leftPx) + 'px';
          btn.style.top = Math.round(topPx + (lineHeight - 16) / 2) + 'px';
          btn.title = (isOpen ? 'Hide' : 'Show') + ' generated inputs';
          (function(cmdObj){ btn.addEventListener('click', function(ev){
            ev.preventDefault(); ev.stopPropagation();
            var curText = ta.value || '';
            var curLines = curText.split('\n');
            var existing = findGeneratedRange(curLines, cmdObj.lineIndex, cmdObj.text);
            if (existing){
              // collapse: remove block
              var before = curLines.slice(0, existing.from);
              var after = curLines.slice(existing.to + 1);
              var newLines = before.concat(after);
              setHuman(newLines.join('\n'));
              schedule();
            } else {
              // expand: insert generated inputs with markers
              var entries = deltas.get(cmdObj.lineIndex) || [];
              var ins = ['# BEGIN generated: ' + cmdObj.text];
              for (var ii=0; ii<entries.length; ii++){ ins.push(entries[ii][0] + ',' + entries[ii][1]); }
              ins.push('# END generated: ' + cmdObj.text);
              var head = curLines.slice(0, cmdObj.lineIndex + 1);
              var tail = curLines.slice(cmdObj.lineIndex + 1);
              var newLines = head.concat(ins).concat(tail);
              setHuman(newLines.join('\n'));
              schedule();
            }
          }); })(c);
          ov.appendChild(btn);
        }
      }

      function schedule(){ if (scheduled) return; scheduled = true; requestAnimationFrame(function(){ scheduled = false; render(); }); }

      ta.addEventListener('input', function(){ schedule(); });
      ta.addEventListener('scroll', function(){ schedule(); });
      window.addEventListener('resize', function(){ schedule(); });
      // Re-render after setHuman programmatic updates
      try {
        var __prevSetHuman = setHuman;
        setHuman = function(v){ __prevSetHuman(v); try { schedule(); } catch(e){} };
      } catch(e) {}

      // Initial
      schedule();
    })();

    // ---- Command Palette ----
    (function(){
      var overlay = $("palette-overlay"), input = $("palette-input"), list = $("palette-list");
      if (!overlay || !input || !list) return;

      function extractLabels(){
        try {
          var lines = ($("decoded").value || "").split("\n");
          var labels = [];
          var offset = 0;
          for (var i=0;i<lines.length;i++){
            var line = lines[i];
            var idx = line.indexOf('#');
            if (idx >= 0){
              var lab = line.slice(idx+1).trim();
              if (lab) labels.push({ label: lab, lineIndex: i, offset: offset });
            }
            offset += line.length + 1;
          }
          return labels;
        } catch(e){ return []; }
      }

      function selectInTextarea(start, len){
        try {
          var ta = $("decoded");
          ta.focus();
          ta.setSelectionRange(start, start + len);
          var textBefore = ta.value.substring(0, start);
          var lineNumber = textBefore.split('\n').length;
          var style = window.getComputedStyle(ta);
          var lineHeight = parseFloat(style.lineHeight) || (parseFloat(style.fontSize) * 1.2) || 15;
          var scrollTop = (lineNumber - 1) * lineHeight;
          ta.scrollTop = scrollTop - (ta.clientHeight / 2) + (lineHeight / 2);
        } catch(e){}
      }

      function gotoFrame(n){
        var txt = $("decoded").value || "";
        var lines = txt.split("\n");
        var offset = 0;
        for (var i=0;i<lines.length;i++){
          var line = lines[i];
          var fc = line.split(',')[0].trim();
          var fr = parseInt(fc, 10);
          if (!isNaN(fr) && fr === n){
            selectInTextarea(offset, 0);
            return true;
          }
          offset += line.length + 1;
        }
        return false;
      }

      function computeItems(q){
        var items = [];
        var query = String(q||"").trim();
        var labels = extractLabels();
        // Run typed hold/tap
        if (/^(tap|hold|shift)\s+/i.test(query)){
          items.push({ title: 'Run command', sub: query, action: function(){ executeTasCommand(query); close(); } });
        }
        // Frame
        if (/^\d+$/.test(query)){
          var n = parseInt(query,10);
          items.push({ title: 'Go to frame ' + n, sub: 'Selects the line starting with ' + n, action: function(){ gotoFrame(n); close(); } });
        }
        // Labels
        if (query){
          var matches = labels.filter(function(l){ return l.label.toLowerCase().includes(query.toLowerCase()); }).slice(0,10);
          matches.forEach(function(l){ items.push({ title: 'Go to label', sub: l.label, action: function(){ selectInTextarea(l.offset, 0); close(); } }); });
        } else {
          labels.slice(0,5).forEach(function(l){ items.push({ title: 'Go to label', sub: l.label, action: function(){ selectInTextarea(l.offset, 0); close(); } }); });
        }
        // Common actions
        items.push({ title: 'Apply', sub: 'Encode and send to game', action: function(){ try { $("apply").click(); } catch(e){} close(); } });
        items.push({ title: 'Copy', sub: 'Copy decoded to clipboard', action: function(){ try { $("copy").click(); } catch(e){} close(); } });
        items.push({ title: 'Clear', sub: 'Clear decoded and encoded', action: function(){ try { $("clear").click(); } catch(e){} close(); } });
        items.push({ title: 'Save to File', sub: 'Write decoded script to .tas', action: function(){ try { $("save-file").click(); } catch(e){} close(); } });
        items.push({ title: 'Load from File', sub: 'Load decoded script from file', action: function(){ try { $("load-file").click(); } catch(e){} close(); } });
        return items;
      }

      var state = { items: [], idx: 0 };
      function render(){
        list.textContent = '';
        state.items.forEach(function(it, i){
          var div = document.createElement('div');
          div.className = 'palette-item' + (i === state.idx ? ' active' : '');
          var t = document.createElement('div'); t.className = 'palette-title'; t.textContent = it.title;
          var s = document.createElement('div'); s.className = 'palette-sub'; s.textContent = it.sub || '';
          div.appendChild(t); div.appendChild(s);
          div.addEventListener('mousedown', function(e){ e.preventDefault(); state.idx = i; render(); });
          div.addEventListener('dblclick', function(){ try { state.items[i].action(); } catch(e){} });
          list.appendChild(div);
        });
      }
      function open(){ overlay.style.display = 'flex'; input.value = ''; state.items = computeItems(''); state.idx = 0; render(); setTimeout(function(){ try { input.focus(); } catch(e){} }, 0); }
      function close(){ overlay.style.display = 'none'; }

      input.addEventListener('input', function(){ state.items = computeItems(input.value); state.idx = 0; render(); });
      input.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown'){ e.preventDefault(); if (state.items.length) { state.idx = (state.idx + 1) % state.items.length; render(); } }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); if (state.items.length) { state.idx = (state.idx - 1 + state.items.length) % state.items.length; render(); } }
        else if (e.key === 'Enter'){ e.preventDefault(); if (state.items[state.idx]) try { state.items[state.idx].action(); } catch(e){} }
        else if (e.key === 'Escape'){ e.preventDefault(); close(); }
      });
      overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });

      window.addEventListener('keydown', function(e){
        if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')){ e.preventDefault(); open(); }
        else if (overlay.style.display !== 'none' && e.key === 'Escape'){ e.preventDefault(); close(); }
      }, true);
    })();

    // ---- Bookmarks (Labels) Overlay ----
    (function(){
      var overlay = $("bookmarks-overlay"), input = $("bookmarks-filter"), list = $("bookmarks-list");
      var openBtn = $("bookmarks-open");
      if (!overlay || !input || !list) return;

      function extractLabels(){
        try {
          var text = $("decoded").value || "";
          var lines = text.split("\n");
          var labels = [];
          var offset = 0;
          for (var i=0;i<lines.length;i++){
            var line = lines[i];
            var hash = line.indexOf('#');
            if (hash >= 0){
              var lab = line.slice(hash+1).trim();
              if (lab) {
                var comma = line.indexOf(',');
                var frameStr = comma >= 0 ? line.slice(0, comma).trim() : '';
                var frame = parseInt(frameStr, 10);
                labels.push({ label: lab, lineIndex: i, offset: offset + hash, lineOffset: offset, frame: isNaN(frame) ? null : frame, fullLine: line });
              }
            }
            offset += line.length + 1;
          }
          return labels;
        } catch(e){ return []; }
      }

      function selectInTextarea(start, len){
        try {
          var ta = $("decoded");
          ta.focus();
          ta.setSelectionRange(start, start + len);
          var textBefore = ta.value.substring(0, start);
          var lineNumber = textBefore.split('\n').length;
          var style = window.getComputedStyle(ta);
          var lineHeight = parseFloat(style.lineHeight) || (parseFloat(style.fontSize) * 1.2) || 15;
          var scrollTop = (lineNumber - 1) * lineHeight;
          ta.scrollTop = scrollTop - (ta.clientHeight / 2) + (lineHeight / 2);
        } catch(e){}
      }

      function render(filter){
        list.textContent = '';
        var labels = extractLabels();
        var q = String(filter||'').trim().toLowerCase();
        if (q) labels = labels.filter(function(l){ return l.label.toLowerCase().includes(q); });
        labels.forEach(function(l){
          var div = document.createElement('div');
          div.className = 'palette-item';
          var t = document.createElement('div'); t.className = 'palette-title'; t.textContent = l.label;
          var s = document.createElement('div'); s.className = 'palette-sub'; s.textContent = (l.frame != null ? ('Frame ' + l.frame + ' — ') : '') + 'Line ' + (l.lineIndex + 1);
          div.appendChild(t); div.appendChild(s);
          div.addEventListener('dblclick', function(){ try { selectInTextarea(l.lineOffset, 0); close(); } catch(e){} });
          div.addEventListener('click', function(){ try { selectInTextarea(l.lineOffset, 0); } catch(e){} });
          list.appendChild(div);
        });
      }

      function open(){ overlay.style.display = 'flex'; render(''); setTimeout(function(){ try { input.focus(); input.select(); } catch(e){} }, 0); }
      function close(){ overlay.style.display = 'none'; }

      if (openBtn) openBtn.onclick = function(){ open(); };
      input.addEventListener('input', function(){ render(input.value); });
      overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });

      function addLabelAtCaret(){
        try {
          var label = prompt('Label text');
          if (!label) return;
          var ta = $("decoded");
          var caret = typeof ta.selectionStart === 'number' ? ta.selectionStart : (window.lastSel && typeof lastSel.start === 'number' ? lastSel.start : 0);
          var txt = ta.value || '';
          var start = txt.lastIndexOf('\n', Math.max(0, caret - 1)) + 1;
          var end = txt.indexOf('\n', caret); if (end === -1) end = txt.length;
          var before = txt.substring(0, start);
          var after = txt.substring(end);
          var line = txt.substring(start, end);
          var hash = line.indexOf('#');
          var code = hash >= 0 ? line.slice(0, hash).replace(/\s+$/,'') : line.replace(/\s+$/,'');
          var newLine = code.length ? (code + ' # ' + label) : ('# ' + label);
          setHuman(before + newLine + after);
          try { selectInTextarea(start, 0); } catch(e){}
          render(input.value);
        } catch(e){}
      }

      function addLabelAtFrame(){
        try {
          var frameStr = prompt('Frame number'); if (!frameStr) return; var fr = parseInt(frameStr, 10); if (isNaN(fr)) return;
          var label = prompt('Label text'); if (!label) return;
          var ta = $("decoded"); var txt = ta.value || '';
          var lines = txt.split('\n'); var offset = 0; var found = false;
          for (var i=0;i<lines.length;i++){
            var line = lines[i];
            var fc = line.split(',')[0].trim();
            var n = parseInt(fc, 10);
            if (!isNaN(n) && n === fr){
              var hash = line.indexOf('#');
              var code = hash >= 0 ? line.slice(0, hash).replace(/\s+$/,'') : line.replace(/\s+$/,'');
              var newLine = code.length ? (code + ' # ' + label) : ('# ' + label);
              lines[i] = newLine;
              found = true;
              break;
            }
            offset += line.length + 1;
          }
          if (!found){ alert('No line found for frame ' + fr + '.'); return; }
          setHuman(lines.join('\n'));
          try { selectInTextarea(offset, 0); } catch(e){}
          render(input.value);
        } catch(e){}
      }

      $("bookmark-add-current").onclick = function(){ addLabelAtCaret(); };
      $("bookmark-add-by-frame").onclick = function(){ addLabelAtFrame(); };

      // Keyboard shortcuts
      window.addEventListener('keydown', function(e){
        var isMod = e.ctrlKey || e.metaKey;
        if (isMod && !e.altKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')){ e.preventDefault(); open(); }
        else if (isMod && e.shiftKey && (e.key === 'b' || e.key === 'B')){ e.preventDefault(); addLabelAtCaret(); }
        else if (overlay.style.display !== 'none' && e.key === 'Escape'){ e.preventDefault(); close(); }
      }, true);
    })();

        } // end tasPanelInit

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", tasPanelInit);
        } else {
            tasPanelInit();
        }
    })();
    </script>
